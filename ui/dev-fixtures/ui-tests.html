<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jinteki-rs — UI tests</title>
<!-- THE STYLESHEET UNDER TEST. Not a copy of it, not a description of it:
     the file the game ships, so a rule that changes changes this page.

     CACHE-BUSTED, because the first time this page was opened in anger it
     was scored against a stylesheet from an earlier deploy and reported
     7/18 for rules that were already right: a test that can be served a
     stale subject is a test that reports on the wrong thing. -->
<script>
  document.write('<link rel="stylesheet" href="/style.css?bust=' + Date.now() + '">');
</script>
<style>
  /* THE PAGE SCROLLS. The stylesheet under test is the GAME's, and the game
     deliberately pins `html, body { overflow: hidden }` — a board must never
     scroll under a player's thumb. A test page is not a board: it is a long
     document, and inheriting that rule made everything past the first screen
     unreachable. Overridden loudly, and only here. */
  html, body { overflow: auto !important; height: auto !important;
               position: static !important; }
  body { font: 13px/1.5 ui-monospace, monospace; background: #0b0f18; color: #e8ecf5;
         margin: 0; padding: 16px 16px 60px; -webkit-overflow-scrolling: touch; }
  h1 { font-size: 17px; margin: 0 0 4px; }
  .sub { color: #8b95ab; margin-bottom: 16px; }
  .case { border: 1px solid #223; border-radius: 10px; padding: 12px; margin: 12px 0; }
  .case h2 { font-size: 13px; margin: 0 0 8px; color: #9fb4d8; }
  .stage { position: relative; background: #0e1424; border: 1px dashed #2a3350;
           border-radius: 8px; padding: 14px; margin-bottom: 10px;
           display: flex; align-items: flex-start; gap: 10px; }
  .res { white-space: pre-wrap; }
  .pass { color: #5fd39b; } .fail { color: #ff6b6b; font-weight: 700; }
  #summary { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px;
             background: #0b0f18; border-top: 1px solid #223; font-weight: 700; }
</style>
</head>
<body>
<h1>jinteki-rs — UI tests</h1>
<div class="sub">Layout laws asserted against the shipped <code>style.css</code>, in a real
browser, at real sizes. Open this page (it is served at
<code>/dev-fixtures/ui-tests.html</code>) — green is green.</div>
<div id="cases"></div>
<div id="summary">running…</div>

<script>
/* ── the harness ────────────────────────────────────────────────────────
   Small on purpose. A UI law is a statement about GEOMETRY — what covers
   what, what is inside what, which way a stack runs — and the only honest
   way to check one is to lay the real markup out under the real stylesheet
   and measure it. No DOM stub can do that: a stub would be asserting my
   description of the CSS rather than the CSS. */
/* THE RUN MUST NOT DEPEND ON WHERE THE PAGE WAS SCROLLED. A browser restores
   the previous scroll position on reload, and `elementFromPoint` answers
   `null` for anything off screen — so a reload after reading the bottom of
   this page failed hit-tests in suites that were fine, and passed them again
   after a scroll to the top. A test whose result depends on the reader's
   scrollbar is not a test. */
if ("scrollRestoration" in history) history.scrollRestoration = "manual";
window.scrollTo(0, 0);

const results = [];
const suites = [];
function suite(name, build, checks) { suites.push([name, build, checks]); }
function runSuite(name, build, checks) {
  const wrap = document.createElement("div");
  wrap.className = "case";
  wrap.innerHTML = `<h2>${name}</h2><div class="stage"></div><div class="res"></div>`;
  document.getElementById("cases").appendChild(wrap);
  const stage = wrap.querySelector(".stage");
  const ctx = build(stage) || {};
  const out = [];
  const t = {
    ok(cond, msg) {
      results.push(!!cond);
      out.push(`${cond ? "PASS" : "FAIL"}  ${msg}`);
    },
    near(a, b, tol, msg) { t.ok(Math.abs(a - b) <= tol, `${msg} (${a.toFixed(1)} ≈ ${b} ±${tol})`); },
  };
  try { checks(t, ctx, stage); } catch (e) { t.ok(false, "threw: " + e.message); }
  wrap.querySelector(".res").innerHTML = out
    .map((l) => `<div class="${l.startsWith("PASS") ? "pass" : "fail"}">${l}</div>`).join("");
}
const rect = (e) => e.getBoundingClientRect();
const el2 = (tag, cls, text) => {
  const e = document.createElement(tag);
  e.className = cls; e.textContent = text;
  return e;
};
/* WHAT IS ACTUALLY DRAWN AT THIS POINT. `elementFromPoint` speaks viewport
   coordinates and answers `null` for anything scrolled off screen — which,
   on a page long enough to need scrolling, silently turned every hit-test
   into a failure that looked like a layout bug. Scroll the subject into view
   first, then ask. */
function drawnAt(el, dx, dy) {
  el.scrollIntoView({ block: "center", inline: "nearest" });
  const r = el.getBoundingClientRect();
  return document.elementFromPoint(r.x + dx, r.y + dy);
}
const card = (cls, name) => {
  const d = document.createElement("div");
  d.className = "card" + (cls ? " " + cls : "");
  d.innerHTML = `<div class="cname">${name || "Card"}</div>`;
  return d;
};

/* ── 1. A card carrying cards is ONE footprint (CR 1.13.1) ───────────── */
suite("Hosting: the host is the top card, what it carries is tucked behind", (stage) => {
  const mk = (n) => {
    const box = document.createElement("div");
    box.className = "hosting";
    const stack = document.createElement("div");
    stack.className = "host-stack";
    const PEEK = 8, CHIP = 16, H = 64;
    for (let i = 0; i < n; i++) stack.appendChild(card("", "Archived Memories " + (i + 1)));
    box.appendChild(stack);
    box.appendChild(card("", "Cupellation"));
    const inside = Math.round(H * 0.66) - 2;
    box.style.setProperty("--peek", Math.max(PEEK, n * (CHIP + 1) - inside + 2) + "px");
    stage.appendChild(box);
    return box;
  };
  const bare = card("", "Daily Casts");
  stage.appendChild(bare);
  return { one: mk(1), five: mk(5), bare };
}, (t, c) => {
  const host = (box) => box.querySelector(":scope > .card");
  const kids = (box) => [...box.querySelectorAll(".host-stack .card")];

  // THE HOST IS THE TOP CARD — asserted the way a finger asks it, by
  // hit-testing the middle of the host. A z-index comparison would not do:
  // the carried cards inherit `auto` inside their own stacking context, so
  // the numbers say nothing about what a tap actually lands on.
  const hostEl = host(c.five);
  const hit = drawnAt(hostEl, rect(hostEl).width / 2, 4);
  t.ok(hit === hostEl || hostEl.contains(hit),
    "the host's own face is the top card where nothing is carried over it");

  // EVERY CARRIED CARD SAYS WHAT IT IS. The previous version of this test
  // asked only whether an EDGE showed, and passed a layout where five
  // carried cards were five anonymous slivers — you could see that something
  // was there and never learn what. An edge is not an answer; a NAME is.
  kids(c.five).forEach((k, i) => {
    const name = k.querySelector(".cname");
    const nr = rect(name);
    const cs = getComputedStyle(name);
    const visible = cs.visibility === "visible" && cs.display !== "none" &&
      nr.width >= 24 && nr.height >= 7;
    t.ok(visible, `carried card ${i + 1} shows a readable name (${Math.round(nr.width)}×${Math.round(nr.height)})`);
    // …and shows it OVER the host, not behind it: the point on the board
    // where that name is drawn must belong to that card.
    const at = drawnAt(name, nr.width / 2, nr.height / 2);
    t.ok(at === name || k.contains(at), `carried card ${i + 1}'s name is not covered by the host`);
  });

  // ONE COLUMN OF BOARD, whatever it is carrying: a host never grows WIDER,
  // because the row it lives in is the axis that runs out first.
  const w1 = rect(c.one).width + parseFloat(getComputedStyle(c.one).marginRight);
  const w5 = rect(c.five).width + parseFloat(getComputedStyle(c.five).marginRight);
  t.near(w5, w1, 1.5, "a card holding five is no wider than a card holding one");
  t.ok(w5 <= rect(c.bare).width + 12, "and no wider than a bare card plus the peek");

  // What it carries stays inside the room the box RESERVED — the bars may
  // run past the host's own square, but never onto the neighbour, because
  // the margin was set aside for them before they were drawn.
  const box = rect(c.five), mb = parseFloat(getComputedStyle(c.five).marginBottom);
  const spill = kids(c.five).some((e) => rect(e).right > box.right + 1 || rect(e).bottom > box.bottom + mb + 1);
  t.ok(!spill, "nothing spills past the room the box reserved");

  // A carried card is a BAR, not a card: one line tall, never a card's worth
  // of board.
  const kr = rect(kids(c.five)[0]);
  t.near(kr.height, 16, 1.5, "a carried card is a 16px bar");
  t.ok(kr.height * 5 < rect(host(c.five)).height * 1.6,
    "five of them cost less than two cards of height");

  // A card carrying nothing gets no box at all.
  t.ok(!c.bare.closest(".hosting"), "a card carrying nothing is drawn as a plain card");
});

/* ── 1b. A tabled card is a square of art with its name on it ─────────── */
suite("Cards: square at most, cropped to art, name always readable", (stage) => {
  const plain = card("", "Rashida Jaheem");
  const art = card("art", "Gold Farmer");
  // A stand-in for the art: a flat colour is enough to prove the name is
  // laid over something rather than replaced by it.
  art.style.backgroundImage = "linear-gradient(135deg,#c9a227,#7a3b12)";
  stage.appendChild(plain);
  stage.appendChild(art);
  return { plain, art };
}, (t, c) => {
  for (const [what, e] of [["a plain card", c.plain], ["a card showing art", c.art]]) {
    const r = rect(e);
    t.ok(r.height <= r.width + 0.5, `${what} is square at most (${r.width}×${r.height})`);
    const name = e.querySelector(".cname");
    const cs = getComputedStyle(name);
    t.ok(cs.visibility === "visible" && cs.display !== "none", `${what} shows its name`);
    const nr = rect(name);
    t.ok(nr.width > r.width * 0.6 && nr.bottom <= r.bottom + 0.5,
      `${what}'s name is laid across the bottom of the crop`);
    t.ok(/gradient|rgba?\(/.test(cs.backgroundImage + cs.backgroundColor),
      `${what}'s name sits on a scrim, so it survives any art under it`);
  }
  t.ok(getComputedStyle(c.art).backgroundSize === "cover",
    "art is CROPPED to fill the tile, never letterboxed or scrolled");
});

/* ── 1c. A SERVER'S ROOT: every card in the stack is its own card ───────
 *
 * Two cards in a remote read as ONE card with a smudge behind it, and the
 * covered one had a 26px sliver to be hit on — a tuck cut for the 88px
 * portrait card and never re-cut when a tabled card became a 64px square.
 * Under a thumb that is nothing. Every card in a stack must own a band deep
 * enough to see AND to hit, and the layers must be told apart at a glance —
 * including from a HOSTED card, which is a 16px bar and a different thing
 * entirely. */
const THUMB = 36;   // the least band a finger should have to find
suite("A server's root: every card in the stack can be seen and tapped", (stage) => {
  const stack = document.createElement("div");
  stack.className = "root-stack tucked";
  ["Rashida Jaheem", "Manegarm Skunk…", "Global Food Ini…"].forEach((n) => stack.appendChild(card("", n)));
  stage.appendChild(stack);
  return { stack, cards: [...stack.querySelectorAll(".card")] };
}, (t, c) => {
  const boxes = c.cards.map(rect);
  // Each card's OWN band: the vertical strip not covered by the next one.
  for (let i = 0; i < boxes.length; i++) {
    const band = i === boxes.length - 1
      ? boxes[i].height
      : boxes[i + 1].y - boxes[i].y;
    t.ok(band >= THUMB, `card ${i + 1} keeps a band a thumb can find (${Math.round(band)}px ≥ ${THUMB})`);
    // …and that band really belongs to it: hit-test the middle of the strip.
    const at = drawnAt(c.cards[i], boxes[i].width / 2, Math.min(band, boxes[i].height) / 2);
    t.ok(at === c.cards[i] || c.cards[i].contains(at),
      `card ${i + 1}'s own band answers to card ${i + 1}`);
  }
  // A stack of three is not three cards' worth of board.
  const total = rect(c.stack).height;
  t.ok(total < boxes[0].height * boxes.length,
    `three tucked cards cost less than three cards of height (${Math.round(total)}px)`);
  // NOT CONFUSABLE WITH A HOSTED CARD: a hosted card is a 16px bar inside a
  // host's own square; a stacked card is a whole card with a seam above it.
  const seam = getComputedStyle(c.cards[1]).boxShadow;
  t.ok(seam && seam !== "none", "each layer draws a seam, so two tiles never read as one");
  t.ok(boxes[1].height >= 60, "a stacked card is a whole card, not a bar");
});

/* ── 2. Counters sit dead centre, and cannot eat a tap ───────────────── */
const BADGES = `<div class="badges tight">
  <div class="badge adv">3</div><div class="badge cred">⬡2</div><div class="badge vir">☣1</div></div>`;
suite("Counters: dead centre, over art, clear of the name, on every size", (stage) => {
  const plain = card("", "Ice Wall");
  plain.innerHTML += BADGES;
  const art = card("art", "Nebula Talent Management: Making Stars");
  art.style.backgroundImage = "linear-gradient(135deg,#3a6ea5,#0e1424)";
  art.innerHTML += BADGES;
  // The deepest truncation the board draws: a carried card's bar.
  const box = document.createElement("div"); box.className = "hosting";
  const stack = document.createElement("div"); stack.className = "host-stack";
  const bar = card("", "Archived Mem…");
  bar.innerHTML += BADGES;
  bar.style.setProperty("--namepad", 3 * 12 + 4 + "px");   // what `hostBox` sets
  stack.appendChild(bar);
  box.appendChild(stack); box.appendChild(card("", "Cupellation"));
  stage.appendChild(plain); stage.appendChild(art); stage.appendChild(box);
  return { plain, art, bar };
}, (t, ctx) => {
  for (const [what, e] of [["a plain card", ctx.plain], ["a card showing art", ctx.art]]) {
    const cr = rect(e);
    const discs = [...e.querySelectorAll(".badge")].map(rect);
    const cx = cr.x + cr.width / 2, cy = cr.y + cr.height / 2;
    t.near(discs[0].y + discs[0].height / 2, cy, 2, `${what}: the discs sit on its vertical centre`);
    const spanL = Math.min(...discs.map((d) => d.x)), spanR = Math.max(...discs.map((d) => d.right));
    t.near((spanL + spanR) / 2, cx, 2, `${what}: and are centred horizontally as a group`);
    t.ok(discs.every((d) => d.x >= cr.x && d.right <= cr.right && d.y >= cr.y && d.bottom <= cr.bottom),
      `${what}: every disc is inside it`);
    // The two things that must both be readable at once, asserted the way a
    // player reads them: hit-test the name, hit-test a disc.
    const nameEl = e.querySelector(".cname");
    const atName = drawnAt(nameEl, 6, 4);
    t.ok(nameEl.contains(atName) || atName === nameEl, `${what}: no disc covers the name`);
    t.ok(getComputedStyle(e.querySelector(".badges")).pointerEvents === "none",
      `${what}: the badge box cannot eat a tap meant for the card`);
  }
  // …and on the bar, where they used to be dropped outright.
  const br = rect(ctx.bar), bd = [...ctx.bar.querySelectorAll(".badge")].map(rect);
  t.ok(bd.length === 3 && bd.every((d) => d.width > 4 && d.height > 4),
    "a carried card's bar still shows every counter it is holding");
  t.ok(bd.every((d) => d.right <= br.right + 0.5 && d.y >= br.y - 0.5 && d.bottom <= br.bottom + 0.5),
    "…inside the bar, at its end");
  // The name yields the room: its box still spans the bar (it is the scrim),
  // but its TEXT stops short of the discs, which is what padding buys.
  const pad = parseFloat(getComputedStyle(ctx.bar.querySelector(".cname")).paddingRight);
  t.ok(pad >= Math.max(...bd.map((d) => d.right)) - Math.min(...bd.map((d) => d.x)),
    `…and the name's text yields the room rather than running under them (${pad}px)`);
});

/* ── 2b. The name is at the top, and a fixed length ──────────────────── */
suite("Names: top of the tile, cut to a fixed length", (stage) => {
  const short = card("", "Sure Gamble");
  const long = card("", "Nebula Talent Man…");   // what `tileName` produces
  stage.appendChild(short); stage.appendChild(long);
  return { short, long };
}, (t, c) => {
  for (const [what, e] of [["a short name", c.short], ["a cut name", c.long]]) {
    const cr = rect(e), nr = rect(e.querySelector(".cname"));
    // Inside the border, not outside it: an absolutely-positioned `top: 0`
    // is the top of the padding box, so the card's own 1.5px border is the
    // whole of the difference.
    t.ok(nr.y - cr.y <= 3, `${what} is laid across the TOP of the tile (+${(nr.y - cr.y).toFixed(1)}px)`);
    t.ok(nr.height <= cr.height * 0.42, `${what}'s band is a fixed slice of the tile, not half of it`);
  }
  t.near(rect(c.short.querySelector(".cname")).height,
    rect(c.long.querySelector(".cname")).height, 1.5,
    "a long name and a short one give the SAME band height");
});

/* ── 3. The ice stack turns around with its seat ─────────────────────── */
suite("Ice order: outermost nearest the Runner, in BOTH seats", (stage) => {
  const board = document.createElement("div");
  board.id = "board-probe";
  const srv = document.createElement("div");
  srv.className = "server";
  srv.innerHTML = `<div class="sname">HQ</div><div class="ice-stack">
    <div class="ice-sliver">innermost</div><div class="ice-sliver">outermost</div></div>`;
  board.appendChild(srv);
  stage.appendChild(board);
  return { board, stack: srv.querySelector(".ice-stack") };
}, (t, c) => {
  // The rules the real board carries, applied to the probe by hand: the
  // page cannot host a second #board, so the two class hooks are asserted
  // through the same selectors the stylesheet writes.
  c.board.className = "";
  const runnerSeat = getComputedStyle(c.stack).flexDirection;
  const real = document.createElement("div");
  real.id = "board"; real.className = "flipped"; real.style.display = "none";
  const clone = c.stack.parentElement.cloneNode(true);
  real.appendChild(clone);
  document.body.appendChild(real);
  const corpSeat = getComputedStyle(clone.querySelector(".ice-stack")).flexDirection;
  real.remove();
  t.ok(runnerSeat === "column", `the Runner's seat runs innermost-first (${runnerSeat})`);
  t.ok(corpSeat === "column-reverse", `the Corp's seat turns it around (${corpSeat})`);
});

/* ── 4. Readers and sheets are bounded and scrollable ────────────────── */
suite("Nothing that lists things can run off the screen", (stage) => {
  const ov = document.createElement("div");
  ov.className = "zoom-overlay"; ov.style.position = "relative"; ov.style.inset = "auto";
  const pile = document.createElement("div");
  pile.className = "zoom-card pile";
  const grid = `<div class="pilegrid">` +
    Array.from({ length: 30 }, (_, i) => `<div class="pilecell">${
      `<div class="card"><div class="cname">Card ${i + 1}</div></div>`}</div>`).join("") + `</div>`;
  pile.innerHTML = "<h3>Heap (30)</h3>" + grid;
  ov.appendChild(pile);
  stage.appendChild(ov);
  // NOT a run menu. Choosing a server to run is asked ON THE BOARD — gold
  // candidates, tap to arm, tap to run (see `runPick` in app.js) — and the
  // list this replaced is gone. Action sheets are still how a card with
  // several abilities, or a server column carrying two different choices,
  // asks its question, and those are what this probe bounds. Labelled
  // "Option" so the page cannot be misread as the old menu returning.
  const sheet = document.createElement("div");
  sheet.className = "action-sheet"; sheet.style.position = "relative";
  sheet.innerHTML = Array.from({ length: 12 }, (_, i) => `<button class="chip">Option ${i + 1}</button>`).join("");
  stage.appendChild(sheet);
  return { pile, sheet, grid: pile.querySelector(".pilegrid") };
}, (t, c) => {
  t.ok(getComputedStyle(c.pile).overflowY === "auto", "the pile reader scrolls");
  t.ok(getComputedStyle(c.pile).touchAction === "pan-y", "the browser owns the pan (a drag is not a tap)");
  t.ok(getComputedStyle(c.sheet).overflowY === "auto", "a long action sheet scrolls");

  // MEASURED, NOT DECLARED. This used to read `max-height` off the computed
  // style and call that "never taller than the screen" — a property is not a
  // box, and the assertion passed while the thing on screen ran off the
  // bottom of it. Both are now asked the only question that matters: how
  // tall are you, actually?
  for (const [what, e] of [["the pile reader", c.pile], ["a long action sheet", c.sheet]]) {
    t.ok(rect(e).height <= window.innerHeight,
      `${what} is not taller than the screen (${Math.round(rect(e).height)} ≤ ${window.innerHeight})`);
  }

  // A PILE IS A GRID, not a column: thirty cards must not be thirty rows.
  const cells = [...c.grid.querySelectorAll(".pilecell")].map(rect);
  const rows = new Set(cells.map((r) => Math.round(r.y)));
  t.ok(cells.length === 30 && rows.size < 30 / 2,
    `thirty cards lay out as a grid, not a column (${rows.size} rows)`);
  t.ok(cells[0].y < cells[cells.length - 1].y || cells[0].x < cells[cells.length - 1].x,
    "and they run in placement order: first placed first, most recent last");
});

/* ── 4b. …IN BOTH ORIENTATIONS ───────────────────────────────────────────
 *
 * The suite above only ever asked the question in whatever shape the tester's
 * window happened to be. That is how a real bug shipped: the landscape CARD
 * READER layout (art left, text right) also caught the PILE, reserving an
 * empty 36% column and crushing thirty tiles into one column of thirty rows
 * — invisible in a portrait window, glaring on a desktop. A test that only
 * runs in one orientation tests one orientation.
 *
 * An iframe's media queries follow ITS OWN box, so both shapes can be asked
 * on one screen: 900x420 is landscape, 420x900 is portrait, and the pile
 * must be a grid in each. */
/* The frames are built HERE, at parse time, not inside the suite: an iframe
   created during the run has not fetched its stylesheet yet, and measuring an
   unstyled box measures nothing. Built before `load`, they are laid out and
   styled by the time any suite runs, because `load` waits for them. */
const ORIENT_FRAMES = (() => {
  const holder = document.createElement("div");
  holder.id = "orient-frames";
  holder.style.cssText = "display:flex;flex-wrap:wrap;gap:8px";
  const mk = (w, h) => {
    const f = document.createElement("iframe");
    f.width = w; f.height = h;
    // `flex: 0 0 auto` is load-bearing: a shrunk 900px frame is not a
    // landscape frame — the media query follows the box it ends up with.
    f.style.cssText = `width:${w}px;height:${h}px;flex:0 0 auto;border:1px solid #2a3350;border-radius:8px;background:#0b0f18`;
    f.srcdoc = `<link rel="stylesheet" href="/style.css?bust=${Date.now()}">
      <body style="margin:0;background:#0b0f18">
      <div class="zoom-overlay" style="position:relative;inset:auto">
      <div class="zoom-card pile"><h3>Heap (30)</h3><div class="pilegrid">` +
      Array.from({ length: 30 }, (_, i) =>
        `<div class="pilecell"><div class="card"><div class="cname">Card ${i + 1}</div></div></div>`).join("") +
      `</div></div></div>`;
    holder.appendChild(f);
    return f;
  };
  const frames = { holder, land: mk(900, 420), port: mk(420, 900) };
  document.addEventListener("DOMContentLoaded", () => document.body.appendChild(holder));
  return frames;
})();

suite("A pile is a grid in BOTH orientations", (stage) => {
  // NOT re-parented: moving an iframe in the DOM reloads it, and a reloaded
  // frame is an empty one. The probes stay where they were built (below) and
  // this stage only says so.
  stage.appendChild(el2("div", "zline",
    "the two probe frames are at the foot of this page — 900×420 and 420×900"));
  return { land: ORIENT_FRAMES.land, port: ORIENT_FRAMES.port };
}, (t, c) => {
  for (const [what, f] of [["landscape", c.land], ["portrait", c.port]]) {
    const d = f.contentDocument;
    const win = f.contentWindow;
    t.ok(win.matchMedia("(orientation: " + what + ")").matches, `the ${what} frame really is ${what}`);
    const cells = [...d.querySelectorAll(".pilecell")].map((e) => e.getBoundingClientRect());
    const rows = new Set(cells.map((r) => Math.round(r.y)));
    t.ok(rows.size < 30 / 2, `${what}: thirty cards lay out as a grid (${rows.size} rows)`);
    const pile = d.querySelector(".zoom-card.pile");
    t.ok(pile.getBoundingClientRect().height <= win.innerHeight,
      `${what}: and the pile fits the screen it is on`);
  }
});

/* AFTER LOAD, never at parse time: the stylesheet is attached by script and
   a measurement taken before it applies is a measurement of nothing. */
window.addEventListener("load", () => {
  suites.forEach(([n, b, c]) => runSuite(n, b, c));
  const passed = results.filter(Boolean).length;
  const el = document.getElementById("summary");
  el.textContent = `${passed}/${results.length} passed`;
  el.className = passed === results.length ? "pass" : "fail";
});
</script>
</body>
</html>
